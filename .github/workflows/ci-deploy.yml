name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatfish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bash -n deploy/receive-release.sh deploy/install-admin-https.sh scripts/start.sh

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish tested code to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; skipping this superseded deployment.'
            exit 0
          fi
          umask 077
          task_ssh_dir=$(mktemp -d)
          trap 'rm -rf "$task_ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          git archive --format=tar.gz HEAD package.json src public scripts/start.sh scripts/lib > "$task_ssh_dir/release.tar.gz"
          { printf '%s\n' "$GITHUB_SHA"; cat "$task_ssh_dir/release.tar.gz"; } |
            ssh -T -i "$task_ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_ssh_dir/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "fatfish-deploy@$DEPLOY_HOST"
