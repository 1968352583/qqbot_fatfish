name: Check deployment network
on:
  workflow_dispatch:
    inputs:
      expected_target_sha256:
        description: Optional SHA-256 of the expected deployment host
        required: false
        type: string
      expected_deploy_public_key_sha256:
        description: Optional SHA-256 of the verified deployment public key (type and base64)
        required: false
        type: string
      expected_server_public_key_sha256:
        description: Optional SHA-256 of the verified SSH server public key (type and base64)
        required: false
        type: string
permissions: {}
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
      - name: Validate deployment credentials without publishing their contents
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EXPECTED_DEPLOY_KEY: ${{ inputs.expected_deploy_public_key_sha256 }}
          EXPECTED_SERVER_KEY: ${{ inputs.expected_server_public_key_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, tempfile
          def fingerprint(public_key):
              return hashlib.sha256(' '.join(public_key.split()[:2]).encode()).hexdigest()
          with tempfile.TemporaryDirectory() as directory:
              key = pathlib.Path(directory) / 'key'
              known_hosts = pathlib.Path(directory) / 'known_hosts'
              for path, value in [(key, os.environ['DEPLOY_KEY']), (known_hosts, os.environ['DEPLOY_KNOWN_HOSTS'])]:
                  path.touch(mode=0o600)
                  path.write_text(value.rstrip() + '\n')
              public = subprocess.run(['ssh-keygen', '-y', '-P', '', '-f', str(key)], capture_output=True, text=True)
              print('Deployment private key parses without a passphrase:', public.returncode == 0, flush=True)
              if public.returncode:
                  raise SystemExit(2)
              expected = os.environ.get('EXPECTED_DEPLOY_KEY', '')
              if expected:
                  matches = fingerprint(public.stdout) == expected
                  print('Deployment key matches verified working key:', matches, flush=True)
                  if not matches:
                      raise SystemExit(2)
              entries = subprocess.run(['ssh-keygen', '-F', os.environ['DEPLOY_HOST'], '-f', str(known_hosts)], capture_output=True, text=True)
              keys = [' '.join(line.split()[1:3]) for line in entries.stdout.splitlines() if line and not line.startswith('#')]
              print('Known hosts contains the deployment target:', bool(keys), flush=True)
              if not keys:
                  raise SystemExit(2)
              expected = os.environ.get('EXPECTED_SERVER_KEY', '')
              if expected:
                  matches = any(fingerprint(value) == expected for value in keys)
                  print('Known hosts matches verified server key:', matches, flush=True)
                  if not matches:
                      raise SystemExit(2)
          PY
      - name: Check server connection paths without changing them
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          EXPECTED_TARGET_SHA256: ${{ inputs.expected_target_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, socket
          host = os.environ['DEPLOY_HOST']
          expected = os.environ.get('EXPECTED_TARGET_SHA256', '')
          print('Target contains surrounding whitespace:', host != host.strip())
          if expected:
              matches = hashlib.sha256(host.encode()).hexdigest() == expected
              print('Deployment target matches expected server:', matches, flush=True)
              if not matches:
                  raise SystemExit(2)
          socket.inet_aton(host)
          print('Target is a literal IPv4 address; DNS is not used.')
          print('Proxy environment variable names:', sorted(k for k in os.environ if k.lower().endswith('_proxy')))
          PY
          ip -4 route get "$DEPLOY_HOST"
          echo 'Runner public IPv4:'
          curl -4 --noproxy '*' --connect-timeout 5 --max-time 8 --silent --show-error https://api.ipify.org || true
          echo
          capture_file=$(mktemp)
          sudo timeout 45 tcpdump -l -nn -tttt -S -i any \
            "host $DEPLOY_HOST and tcp and (tcp[tcpflags] & (tcp-syn|tcp-rst) != 0)" \
            > "$capture_file" 2>&1 &
          capture_pid=$!
          trap 'sudo kill -INT "$capture_pid" 2>/dev/null || true; rm -f "$capture_file"' EXIT
          sleep 1
          result=0
          python3 - <<'PY' || result=$?
          import json, os, socket, time
          from concurrent.futures import ThreadPoolExecutor
          host = os.environ['DEPLOY_HOST']
          required = {22, 80, 8888}
          def probe(port):
              started = time.monotonic()
              try:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                      sock.settimeout(8)
                      sock.bind(('0.0.0.0', 44000 + port))
                      sock.connect((host, port))
                      return {'port': port, 'connected': True, 'seconds': round(time.monotonic() - started, 3)}
              except OSError as error:
                  return {'port': port, 'connected': False, 'error': str(error), 'seconds': round(time.monotonic() - started, 3)}
          with ThreadPoolExecutor(max_workers=5) as pool:
              results = list(pool.map(probe, [22, 80, 443, 888, 8888]))
          for item in results:
              print(json.dumps(item), flush=True)
          raise SystemExit(1 if any(not item['connected'] for item in results if item['port'] in required) else 0)
          PY
          sudo kill -INT "$capture_pid" 2>/dev/null || true
          wait "$capture_pid" || true
          echo 'Handshake headers only (no application payload):'
          cat "$capture_file"
          exit "$result"
