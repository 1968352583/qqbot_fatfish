<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 陪伴工作台</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="login" class="login hidden">
    <div class="login-art"><span class="eyebrow">FATFISH / PRIVATE SPACE</span><div class="fish">◕<span>ᴗ</span>◕</div><h1>把日常，慢慢记住。</h1><p>一个有记忆、会接话、偶尔来找你的 QQ 朋友。</p><span class="watermark">大肥鱼</span></div>
    <form id="login-form"><span class="eyebrow">管理员入口</span><h2>欢迎回来</h2><p class="muted">查看聊天、照顾记忆，调整你们的相处方式。</p><label>管理员密码<input id="password" type="password" autocomplete="current-password" required minlength="12"></label><button class="primary" type="submit">进入工作台 <span>↗</span></button><p id="login-note" class="muted small hidden"></p></form>
  </section>
  <div id="shell" class="shell hidden">
    <aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">◕ᴗ◕</span><span>大肥鱼<small>陪伴工作台</small></span></a><div class="nav-label">日常管理</div><nav id="nav"></nav><div class="sidebar-foot"><span class="dot" id="connection-dot"></span><span id="connection">连接中</span><button id="logout" class="text-button">退出</button></div></aside>
    <main><header><div><span class="eyebrow">PRIVATE COMPANION / QQ</span><h1 id="page-title">今天，一切都好。</h1></div><button id="refresh" class="secondary">↻ 刷新</button></header><div id="content"></div><footer>只在 QQ 单聊中相伴 · 每个用户的记忆分别保存</footer></main>
  </div>
  <dialog id="dialog"><form id="dialog-form"><h2 id="dialog-title"></h2><p id="dialog-description" class="muted"></p><textarea id="dialog-value" rows="5"></textarea><div class="actions"><button type="button" id="dialog-cancel" class="secondary">取消</button><button type="submit" class="primary" id="dialog-submit">保存</button></div></form></dialog>
</body></html>
