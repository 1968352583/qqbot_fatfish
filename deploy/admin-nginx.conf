# Rendered by install-admin-https.sh. Keep the application on loopback.
limit_req_zone $binary_remote_addr zone=fatfish_login:1m rate=5r/m;

server {
    listen 80;
    server_name __ADMIN_IP__;
    return 301 https://__ADMIN_IP__$request_uri;
}

server {
    listen 443 ssl;
    server_name __ADMIN_IP__;
    if ($host != "__ADMIN_IP__") { return 444; }

    ssl_certificate /etc/fatfish/tls/cert.pem;
    ssl_certificate_key /etc/fatfish/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fatfish_tls:1m;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_timeout 15s;
    access_log off;
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host __ADMIN_IP__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;

    location = /api/login {
        limit_req zone=fatfish_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3210;
    }
    location / {
        proxy_pass http://127.0.0.1:3210;
    }
}
